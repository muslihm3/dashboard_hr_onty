function Card({ children, style }) {

    <div style={{
      background: COLORS.panel,
      borderRadius: 14,
      border: `1px solid ${COLORS.brandLight}55`,
      boxShadow: "0 2px 10px rgba(92,58,33,0.06)",
      padding: "18px 20px",
      ...style
    }}>{children}</div>

function Ticket({ label, value, sub, accent, trendVal, trendLabel }) {
  return (
    <div style={{
      background: COLORS.panel,
      borderRadius: 12,
      border: `1.5px dashed ${accent}88`,
      padding: "16px 18px",
      position: "relative",
      minWidth: 0,
    }}>
      <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: COLORS.brandMid, fontWeight: 700, fontFamily: "'Trebuchet MS', sans-serif" }}>{label}</div>
      <div style={{ fontSize: 30, fontWeight: 800, color: accent, marginTop: 4, fontFamily: "'Trebuchet MS', sans-serif" }}>{value}</div>
      {sub && <div style={{ fontSize: 12.5, color: COLORS.ink, opacity: 0.75, marginTop: 3 }}>{sub}</div>}
      {trendVal !== undefined && (
        <div style={{ fontSize: 12, marginTop: 6, fontWeight: 700, color: trendVal < 0 ? COLORS.danger : COLORS.good }}>
          {trendVal < 0 ? "▼" : trendVal > 0 ? "▲" : "▬"} {Math.abs(trendVal).toFixed(2)} {trendLabel || ""}
        </div>
      )}
    </div>
  );
}

function SectionTitle({ eyebrow, title, desc }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.5, color: COLORS.gold, textTransform: "uppercase", fontFamily: "'Trebuchet MS', sans-serif" }}>{eyebrow}</div>
      <div style={{ fontSize: 20, fontWeight: 800, color: COLORS.brandDark, marginTop: 2, fontFamily: "'Trebuchet MS', sans-serif" }}>{title}</div>
      {desc && <div style={{ fontSize: 13, color: COLORS.ink, opacity: 0.7, marginTop: 3, maxWidth: 720 }}>{desc}</div>}
    </div>
  );
}

const NARR = (() => {
  const dd = DASHBOARD_DATA;
  const mc = dd.monthly_component, mo = dd.monthly_overall, diag = dd.individu_diagnostic;
  const L = mc[mc.length - 1], F = mc[0], P = mc[mc.length - 2] || mc[0];
  const LM = L.bulan, FM = F.bulan, PM = P.bulan;
  const f2 = v => (v == null ? "-" : Number(v).toFixed(2));
  const KOMP = { attitude: "Attitude", disiplin: "Disiplin", teamwork: "Teamwork", performance: "Performance", inisiatif: "Inisiatif" };
  const KEYS = Object.keys(KOMP);
  const weakKey = KEYS.reduce((a, b) => (L[a] <= L[b] ? a : b));
  const weakCount = k => diag.filter(x => x.kpi_terlemah === KOMP[k]).length;
  const insight = k => `${KOMP[k]} ${L[k] < F[k] ? "turun" : "naik"} dari ${f2(F[k])} (${FM}) ke ${f2(L[k])} (${LM}); ${L[k] >= P[k] ? "naik" : "turun"} ${f2(Math.abs(L[k] - P[k]))} dibanding ${PM}. KPI terlemah untuk ${weakCount(k)} karyawan${k === weakKey ? " — komponen TERLEMAH perusahaan bulan ini." : "."}`;
  const last3 = mo.slice(-3);
  const r3 = last3.map(x => x.rata2);
  const mn = Math.min(...r3), mx = Math.max(...r3), stable = mx - mn <= 0.15;
  const diffAll = mo[0].rata2 - mo[mo.length - 1].rata2;
  const adaptif = `Rata-rata perusahaan ${stable ? "stabil" : "bergerak"} di kisaran ${mn.toFixed(2)}–${mx.toFixed(2)} selama ${last3.length} bulan terakhir (${last3[0].bulan}–${LM}); dibanding ${mo[0].bulan} (${mo[0].rata2}) ${diffAll >= 0 ? "turun" : "naik"} ${Math.abs(diffAll).toFixed(2)} poin. ${stable ? "Sinyal titik dasar sudah ditemukan, tinggal didorong naik lagi." : "Belum stabil — pantau terus bulan depan."}`;
  let drops = 0, rises = 0, worst = null;
  for (let i = 1; i < mo.length; i++) {
    const dlt = mo[i].rata2 - mo[i - 1].rata2;
    if (dlt < 0) drops++; else if (dlt > 0) rises++;
    if (worst === null || dlt < worst.dlt) worst = { dlt, bulan: mo[i].bulan };
  }
  const nChg = mo.length - 1;
  const overviewNote = drops === nChg
    ? "Skor turun setiap bulan berturut-turut tanpa kecuali (n bervariasi karena jumlah karyawan dinilai tiap bulan berbeda). Pola ini merata di hampir semua divisi & individu — indikasi kuat ada faktor sistemik (kalibrasi penilai, beban kerja, atau musiman), bukan cuma soal performa personal."
    : `Rata-rata ${diffAll >= 0 ? "turun" : "naik"} dari ${mo[0].rata2} (${mo[0].bulan}) ke ${mo[mo.length - 1].rata2} (${LM}): ${drops} dari ${nChg} perubahan bulanan menurun dan ${rises} naik; penurunan terbesar terjadi di ${worst.bulan} (${worst.dlt.toFixed(2)}). n bervariasi karena jumlah karyawan dinilai tiap bulan berbeda. ${stable ? `Tiga bulan terakhir relatif datar (${mn.toFixed(2)}–${mx.toFixed(2)}), jadi fokus bergeser dari "menahan penurunan" ke "mengangkat kembali".` : "Pergerakan masih belum stabil."}`;
  const MI = m => dd.months_present.indexOf(m);
  const anomalies = [];
  Object.keys(dd.monthly_snapshots).forEach(m => {
    const g = {};
    dd.monthly_snapshots[m].employees.forEach(e => KEYS.forEach(c => {
      if (e[c] == null) { const key = `${e.brand}|${e.divisi}|${c}`; (g[key] = g[key] || []).push(e.nama); }
    }));
    Object.keys(g).forEach(key => { const [b, dv, c] = key.split("|"); anomalies.push({ m, b, dv, c, names: g[key] }); });
  });
  anomalies.sort((a, b) => (MI(b.m) - MI(a.m)) || (b.names.length - a.names.length));
  const anomalyLines = anomalies.slice(0, 6).map(a => `Kolom ${KOMP[a.c]} ${a.dv === a.b ? a.dv : a.dv + " " + a.b} ${a.m}: ${a.names.length} orang tanpa nilai valid (kosong / di luar skala 1–5)${a.names.length <= 3 ? " — " + a.names.join(", ") : ""} — cek & perbaiki di sheet sumber.`);
  const cnt = k => diag.filter(x => x.kategori_aksi === k).length;
  const rad = (dd.monthly_snapshots[LM] || { division_radar: {} }).division_radar;
  let low = null;
  Object.keys(rad).forEach(dv => { const v = rad[dv][weakKey]; if (v != null && (low === null || v < low.v)) low = { dv, v }; });
  const ACT = {
    teamwork: "Team building / sesi kolaborasi lintas shift bulan ini untuk mulai membalikkan tren ini.",
    disiplin: "Sepakati ulang aturan jam kerja & checklist harian bersama tim, lalu beri apresiasi nyata bagi yang konsisten — bukan hanya teguran untuk yang terlambat.",
    performance: "Review target & beban kerja agar realistis; pastikan alat, bahan, dan SOP sudah mendukung sebelum menuntut hasil lebih.",
    inisiatif: "Buka ruang usul perbaikan (mis. kotak ide mingguan) dan apresiasi ide yang benar-benar dijalankan.",
    attitude: "Sisipkan sesi apresiasi/syukur singkat di briefing pagi dan cek kenyamanan lingkungan kerja.",
  };
  return { insight, adaptif, overviewNote, anomalyLines, cnt, weakKey, KOMP, L, LM, FM, low, ACT, stable, mn, mx, last3 };
})();

const KAT_COLOR = { "A+": "#2E8B57", "A": "#6FA85A", "B": "#D6B93A", "C": "#D6803A", "D": "#B23A2E" };
const KAT_DESC = { "A+": "> 120%", "A": "111–120%", "B": "90–110%", "C": "70–89%", "D": "< 70%" };

function OpsDivisiSection({ month, brandFilter, snapshot, series }) {
  const KO = KPI_OPERASIONAL;
  const KM = KO.months;
  let opsMonth = month;
  if (!KM.includes(month)) {
    const ord = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const cands = KM.filter(m => ord.indexOf(m) <= ord.indexOf(month));
    opsMonth = cands.length ? cands[cands.length - 1] : KM[KM.length - 1];
  }
  const prevMonth = KM[KM.indexOf(opsMonth) - 1] || null;
  const pct = v => `${Math.round(v * 100)}%`;
  const capAvg = arr => arr.length ? arr.reduce((a, v) => a + Math.min(v, 1.5), 0) / arr.length : null;
  const posAll = KO.posisi.filter(p => brandFilter === "Semua" || p.brand === brandFilter);
  const divNames = [];
  posAll.forEach(p => { if (!divNames.includes(p.divisi)) divNames.push(p.divisi); });
  (snapshot.division_scores || []).forEach(ds => {
    if ((brandFilter === "Semua" || ds.divisi.includes(brandFilter)) && !divNames.includes(ds.divisi)) divNames.push(ds.divisi);
  });
  const behFor = (dv, m) => {
    const row = series.find(r => r.divisi === dv);
    return row && row[m] != null ? row[m] : null;
  };
  const rowsFor = dv => {
    const ps = posAll.filter(p => p.divisi === dv);
    const cur = ps.map(p => ({ p, c: p.months[opsMonth], pv: prevMonth ? p.months[prevMonth] : null })).filter(x => x.c);
    const avg = capAvg(cur.map(x => x.c.total));
    const pvAvg = capAvg(cur.filter(x => x.pv).map(x => x.pv.total));
    const gaps = [];
    cur.forEach(x => x.c.indikator.forEach(i => { if (i.score !== null && i.score < 0.7) gaps.push({ pos: x.p.posisi, i }); }));
    gaps.sort((a, b) => a.i.score - b.i.score);
    return { ps, cur, avg, pvAvg, gaps };
  };
  const reading = (beh, ops) => {
    if (ops === null) return { t: "Belum ada KPI operasional", c: COLORS.brandMid };
    if (beh === null) return { t: "Belum ada penilaian perilaku bulan ini", c: COLORS.brandMid };
    if (beh >= 3.6 && ops >= 1) return { t: "Selaras kuat — pertahankan, jaga beban kerja", c: COLORS.good };
    if (beh < 3.6 && ops >= 1) return { t: "Target tercapai, perilaku menurun — waspada kelelahan", c: COLORS.warn };
    if (beh >= 3.6 && ops < 1) return { t: "Perilaku baik, target belum tercapai — cek hambatan proses", c: COLORS.warn };
    return { t: "Prioritas ganda — coaching + perbaikan proses", c: COLORS.danger };
  };
  const advice = (r) => {
    if (r.t.startsWith("Selaras")) return "Pertahankan ritme; hindari menaikkan target dan beban sekaligus.";
    if (r.t.startsWith("Target tercapai")) return "Hasil kerja bagus tapi skor perilaku turun: lakukan Wellbeing Check 1-on-1 lebih dulu sebelum menambah target, cek jam kerja & kenyamanan.";
    if (r.t.startsWith("Perilaku baik")) return "Sikap tim sudah baik, jadi hambatan kemungkinan di proses/sumber daya (bahan, alat, SOP, target tidak realistis) — telusuri bersama kepala divisi, bukan menyalahkan individu.";
    if (r.t.startsWith("Prioritas")) return "Mulai dari coaching pada KPI perilaku terlemah dan perbaikan proses di indikator operasional terendah secara bertahap.";
    return "";
  };
  const th = { textAlign: "left", padding: "8px 10px", fontSize: 11.5, color: COLORS.brandMid, borderBottom: `1.5px solid ${COLORS.cream}` };
  const td = { padding: "7px 10px", fontSize: 12.5, borderBottom: `1px solid ${COLORS.cream}`, color: COLORS.ink };
  const badge = k => (
    <span style={{ display: "inline-block", minWidth: 28, textAlign: "center", padding: "2px 8px", borderRadius: 999, background: KAT_COLOR[k] || "#999", color: "#fff", fontWeight: 800, fontSize: 12 }}>{k || "-"}</span>
  );
  const summary = divNames.map(dv => {
    const r = rowsFor(dv);
    const beh = behFor(dv, month);
    return { dv, r, beh, rd: reading(beh, r.avg) };
  });
  return (
    <>
      <Card style={{ marginBottom: 20 }}>
        <SectionTitle eyebrow={`KPI Operasional · ${opsMonth}`} title="Target vs Realisasi per Divisi" desc={`Sumber: file KPI FIX ONTY 1 2026 & KPI ONTY 2 2026 (target vs realisasi per posisi), dikelompokkan ke divisi yang sama dengan penilaian perilaku. 100% = tepat target; kategori A+ > 120%, A 111–120%, B 90–110%, C 70–89%, D < 70%. Rata-rata divisi membatasi tiap posisi maksimal 150% agar angka luar biasa tidak menutupi posisi lain.${opsMonth !== month ? ` (KPI operasional untuk ${month} belum ada, ditampilkan ${opsMonth}.)` : ""}`} />
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={th}>Divisi</th><th style={th}>Skor Perilaku</th><th style={th}>Pencapaian Operasional</th><th style={th}>Posisi C/D</th><th style={th}>Pembacaan</th></tr></thead>
            <tbody>
              {summary.map(s => {
                const cd = s.r.cur.filter(x => ["C", "D"].includes(x.c.kategori)).length;
                const dOps = s.r.avg !== null && s.r.pvAvg !== null ? s.r.avg - s.r.pvAvg : null;
                return (
                  <tr key={s.dv}>
                    <td style={{ ...td, fontWeight: 700 }}>{s.dv}</td>
                    <td style={td}>{s.beh !== null ? s.beh.toFixed(2) : "-"}</td>
                    <td style={td}>{s.r.avg !== null ? <b>{pct(s.r.avg)}</b> : "-"}{dOps !== null && <span style={{ marginLeft: 6, fontSize: 11.5, fontWeight: 700, color: dOps >= 0 ? COLORS.good : COLORS.danger }}>{dOps >= 0 ? "▲" : "▼"} {Math.abs(Math.round(dOps * 100))}</span>}</td>
                    <td style={td}>{s.r.cur.length ? `${cd} dari ${s.r.cur.length}` : "-"}</td>
                    <td style={{ ...td, color: s.rd.c, fontWeight: 700 }}>{s.rd.t}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {summary.filter(s => s.r.cur.length).map(s => (
        <Card key={s.dv} style={{ marginBottom: 20 }}>
          <SectionTitle eyebrow={`Analisis Lanjutan · ${opsMonth}`} title={s.dv} desc={`${s.beh !== null ? `Skor perilaku ${s.beh.toFixed(2)}` : "Belum ada skor perilaku"}${s.beh !== null && behFor(s.dv, KM[KM.indexOf(opsMonth) - 1]) !== null && prevMonth ? ` (${(s.beh - behFor(s.dv, prevMonth)) >= 0 ? "naik" : "turun"} ${Math.abs(s.beh - behFor(s.dv, prevMonth)).toFixed(2)} dari ${prevMonth})` : ""}; pencapaian operasional ${s.r.avg !== null ? pct(s.r.avg) : "-"}. ${advice(s.rd)}${s.r.cur.filter(x => ["C", "D"].includes(x.c.kategori)).length ? " Posisi perlu perhatian: " + s.r.cur.filter(x => ["C", "D"].includes(x.c.kategori)).map(x => `${x.p.posisi} (${x.c.kategori}, ${Math.round(x.c.total * 100)}%)`).join(", ") + "." : ""}`} />
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr><th style={th}>Posisi</th><th style={th}>Pencapaian</th><th style={th}>Kategori</th><th style={th}>vs {prevMonth || "-"}</th></tr></thead>
              <tbody>
                {s.r.cur.slice().sort((a, b) => a.c.total - b.c.total).map(x => {
                  const dl = x.pv ? x.c.total - x.pv.total : null;
                  return (
                    <tr key={x.p.brand + x.p.posisi}>
                      <td style={td}>{x.p.posisi}</td>
                      <td style={td}><b>{pct(x.c.total)}</b></td>
                      <td style={td}>{badge(x.c.kategori)}</td>
                      <td style={{ ...td, fontWeight: 700, color: dl === null ? COLORS.brandMid : dl >= 0 ? COLORS.good : COLORS.danger }}>{dl === null ? "-" : `${dl >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(dl * 100))} poin`}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {s.r.gaps.length > 0 && (
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: COLORS.danger, marginBottom: 4 }}>Indikator di bawah 70% target</div>
              <ul style={{ margin: 0, paddingLeft: 20 }}>
                {s.r.gaps.slice(0, 5).map((g, i) => (
                  <li key={i} style={{ fontSize: 13, marginBottom: 4, color: COLORS.ink }}>{g.pos}: {g.i.kpi} — realisasi {g.i.real ?? "-"} vs target {g.i.target ?? "-"} ({pct(g.i.score)})</li>
                ))}
              </ul>
            </div>
          )}
        </Card>
      ))}
    </>
  );
}

                  <Legend />
                  <Line type="monotone" dataKey="performance" name="Performance" stroke={COLORS.gemilang} strokeWidth={2} />
                  <Line type="monotone" dataKey="disiplin" name="Disiplin" stroke={COLORS.amanah} strokeWidth={2} />
                  <Line type="monotone" dataKey="teamwork" name="Teamwork" stroke={COLORS.harmonis} strokeWidth={2} />
                  <Line type="monotone" dataKey="inisiatif" name="Inisiatif" stroke={COLORS.inovatif} strokeWidth={2} />
                  <Line type="monotone" dataKey="attitude" name="Attitude" stroke={COLORS.bersyukur} strokeWidth={2} />
                </LineChart>
              </ResponsiveContainer>
            </Card>

            <Card>
              <SectionTitle eyebrow="Sebaran Nilai" title={`Distribusi Kategori Kinerja — ${monthFilter}`} desc="Berdasarkan skala Keterangan yang ada di sheet asal (1=Sangat Kurang ... 5=Sangat Baik)." />
              <ResponsiveContainer width="100%" height={260}>
                <PieChart>
                  <Pie data={snapshot.distribution} dataKey="jumlah" nameKey="kategori" cx="50%" cy="50%" outerRadius={95} label={(e) => `${e.kategori}: ${e.jumlah}`}>
                    {snapshot.distribution.map((entry, i) => (
                      <Cell key={i} fill={CAT_COLOR[entry.kategori] || COLORS.brandMid} />
                    ))}
                  </Pie>
                  <Tooltip />
                </PieChart>
              </ResponsiveContainer>
            </Card>
          </>
        )}

        {tab === "divisi" && (
          <>
            <Card style={{ marginBottom: 20 }}>
              <SectionTitle eyebrow="Perbandingan Divisi" title="Rata-rata Skor per Divisi per Bulan" />
              <ResponsiveContainer width="100%" height={320}>
                <LineChart margin={{ left: -10, right: 10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e8dcc8" />
                  <XAxis dataKey="bulan" type="category" allowDuplicatedCategory={false} stroke={COLORS.brandDark} />
                  <YAxis domain={[2.5, 5]} stroke={COLORS.brandDark} />
                  <Tooltip contentStyle={{ borderRadius: 10, border: `1px solid ${COLORS.brandLight}` }} />
                  <Legend />
                  {filteredDivisionMonthly.map((row, i) => {
                    const dataPts = MONTHS.map(m => ({ bulan: m, val: row[m] }));
                    return (
                      <Line key={row.divisi} data={dataPts} dataKey="val" name={row.divisi} stroke={VALUE_COLORS[i % VALUE_COLORS.length]} strokeWidth={2.5} connectNulls dot={{ r: 4 }} />
                    );
                  })}
                </LineChart>
              </ResponsiveContainer>
            </Card>

            <Card style={{ marginBottom: 20 }}>
              <SectionTitle eyebrow={`Ranking ${monthFilter}`} title="Divisi dari Terendah ke Tertinggi" desc="Urutan prioritas intervensi HRD bulan depan." />
              <ResponsiveContainer width="100%" height={Math.max(220, filteredDivisionJuni.length * 46)}>
                <BarChart data={filteredDivisionJuni} layout="vertical" margin={{ left: 40 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e8dcc8" />
                  <XAxis type="number" domain={[0, 5]} stroke={COLORS.brandDark} />
                  <YAxis type="category" dataKey="divisi" width={190} stroke={COLORS.brandDark} tick={{ fontSize: 12 }} />
                  <Tooltip contentStyle={{ borderRadius: 10, border: `1px solid ${COLORS.brandLight}` }} />
                  <Bar dataKey="rata2" name={`Rata-rata ${monthFilter}`} radius={[0, 8, 8, 0]}>
                    {filteredDivisionJuni.map((entry, i) => (
                      <Cell key={i} fill={entry.rata2 < 3.5 ? COLORS.danger : entry.rata2 < 4 ? COLORS.warn : COLORS.good} />
                    ))}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </Card>

            <Card>
              <SectionTitle eyebrow="Kekuatan & Kelemahan" title={`Radar 5 Komponen KPI per Divisi (${monthFilter})`} />
              <ResponsiveContainer width="100%" height={380}>
                <RadarChart data={radarData} outerRadius={130}>
                  <PolarGrid stroke="#e8dcc8" />
                  <PolarAngleAxis dataKey="komponen" tick={{ fontSize: 12, fill: COLORS.ink }} />
                  <PolarRadiusAxis domain={[0, 5]} tick={{ fontSize: 10 }} />
                  {filteredDivisionJuni.map((dj, i) => (
                    <Radar key={dj.divisi} name={dj.divisi} dataKey={dj.divisi} stroke={VALUE_COLORS[i % VALUE_COLORS.length]} fill={VALUE_COLORS[i % VALUE_COLORS.length]} fillOpacity={0.12} strokeWidth={2} />
                  ))}
                  <Legend />
                  <Tooltip />
                </RadarChart>
              </ResponsiveContainer>
            </Card>
          
            <OpsDivisiSection month={monthFilter} brandFilter={brandFilter} snapshot={snapshot} series={d.division_monthly_series} />
          </>
        )}

        {tab === "individu" && (
          <>
            <Card style={{ marginBottom: 20 }}>
              <SectionTitle eyebrow="Papan Penghargaan" title={`10 Karyawan Skor Tertinggi — ${monthFilter}`} desc="Kandidat rekognisi/reward bulan ini, penguat nilai Gemilang & Bersyukur." />
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead>
                    <tr style={{ textAlign: "left", color: COLORS.brandDark, borderBottom: `2px solid ${COLORS.gold}` }}>
                      <th style={{ padding: "8px 6px" }}>Nama</th><th>Divisi</th><th>Brand</th><th style={{textAlign:"right"}}>Skor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {topEmployees.map((e, i) => (
                      <tr key={i} style={{ borderBottom: "1px solid #f0e6d4" }}>
                        <td style={{ padding: "7px 6px", fontWeight: 600 }}>{e.nama}</td>
                        <td>{e.divisi}</td>
                        <td>{e.brand}</td>
                        <td style={{ textAlign: "right", fontWeight: 700, color: COLORS.good }}>{e.skor}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>

            <Card style={{ marginBottom: 20 }}>
              <SectionTitle eyebrow="Perlu Pendampingan" title={`10 Karyawan Skor Terendah — ${monthFilter}`} desc="Prioritas coaching 1-on-1 bulan depan." />
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead>
                    <tr style={{ textAlign: "left", color: COLORS.brandDark, borderBottom: `2px solid ${COLORS.gold}` }}>
                      <th style={{ padding: "8px 6px" }}>Nama</th><th>Divisi</th><th>Brand</th>
                      <th style={{textAlign:"right"}}>P</th><th style={{textAlign:"right"}}>D</th><th style={{textAlign:"right"}}>T</th><th style={{textAlign:"right"}}>I</th><th style={{textAlign:"right"}}>A</th>
                      <th style={{textAlign:"right"}}>Skor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {bottomEmployees.map((e, i) => (
                      <tr key={i} style={{ borderBottom: "1px solid #f0e6d4" }}>
                        <td style={{ padding: "7px 6px", fontWeight: 600 }}>{e.nama}</td>
                        <td>{e.divisi}</td>
                        <td>{e.brand}</td>
                        <td style={{textAlign:"right"}}>{e.performance}</td>
                        <td style={{textAlign:"right"}}>{e.disiplin}</td>
                        <td style={{textAlign:"right"}}>{e.teamwork}</td>
                        <td style={{textAlign:"right"}}>{e.inisiatif}</td>
                        <td style={{textAlign:"right"}}>{e.attitude}</td>
                        <td style={{ textAlign: "right", fontWeight: 700, color: COLORS.danger }}>{e.skor}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{fontSize:11.5, color: COLORS.ink, opacity:0.6, marginTop:8}}>P=Performance, D=Disiplin, T=Teamwork, I=Inisiatif, A=Attitude (skala 1–5)</div>
            </Card>

            <Card>
              <SectionTitle eyebrow="Early Warning" title="Karyawan dengan Penurunan Skor Terbesar" desc="Turun ≥1.0 poin sejak penilaian pertama mereka — layak ditelusuri penyebabnya sebelum jadi masalah lebih besar." />
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead>
                    <tr style={{ textAlign: "left", color: COLORS.brandDark, borderBottom: `2px solid ${COLORS.gold}` }}>
                      <th style={{ padding: "8px 6px" }}>Nama</th><th>Divisi</th><th>Brand</th><th>Riwayat Skor</th><th style={{textAlign:"right"}}>Penurunan</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredDecliners.map((e, i) => (
                      <tr key={i} style={{ borderBottom: "1px solid #f0e6d4" }}>
                        <td style={{ padding: "7px 6px", fontWeight: 600 }}>{e.nama}</td>
                        <td>{e.divisi}</td>
                        <td>{e.brand}</td>
                        <td style={{fontSize:12, opacity:0.8}}>{e.bulan_tersedia.map(m => `${m}:${e.skor_per_bulan[m]}`).join(" → ")}</td>
                        <td style={{ textAlign: "right", fontWeight: 700, color: COLORS.danger }}>{e.trend}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          </>
        )}

        {tab === "diagnostik" && (
          <>
            <Card style={{ marginBottom: 20 }}>
              <SectionTitle eyebrow="Diagnostik per Orang" title="KPI Terlemah, Terbaik, Nilai BAHAGIA & Program per Individu" desc="Setiap karyawan dianalisis: komponen KPI paling lemah & paling kuat (bulan terakhir dinilai), nilai BAHAGIA yang paling relevan untuk diperkuat, status tren, dan rekomendasi fokus bulan depan — menyeimbangkan peningkatan kualitas kerja dengan kenyamanan, bukan sekadar 'kejar target'." />
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px,1fr))", gap: 10, marginBottom: 16 }}>
                {Object.entries(kategoriCounts).map(([k, v]) => (
                  <div key={k} onClick={() => setKategoriFilter(kategoriFilter === k ? "Semua" : k)} style={{
                    cursor: "pointer", borderRadius: 10, padding: "10px 12px",
                    border: `1.5px solid ${KATEGORI_COLOR[k] || COLORS.brandMid}`,
                    background: kategoriFilter === k ? `${KATEGORI_COLOR[k]}22` : "#fff",
                  }}>
                    <div style={{ fontSize: 20, fontWeight: 800, color: KATEGORI_COLOR[k] || COLORS.brandMid }}>{v}</div>
                    <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.ink }}>{k}</div>
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
                <input
                  placeholder="Cari nama atau divisi..."
                  value={searchNama}
                  onChange={e => setSearchNama(e.target.value)}
                  style={{
                    flex: "1 1 220px", padding: "9px 14px", borderRadius: 999,
                    border: `1.5px solid ${COLORS.brandLight}`, fontSize: 13, outline: "none",
                  }}
                />
                {kategoriFilter !== "Semua" && (
                  <button onClick={() => setKategoriFilter("Semua")} style={{
                    padding: "8px 14px", borderRadius: 999, border: `1.5px solid ${COLORS.brandDark}`,
                    background: "transparent", color: COLORS.brandDark, fontSize: 12.5, fontWeight: 700, cursor: "pointer"
                  }}>✕ Filter: {kategoriFilter}</button>
                )}
                <div style={{ fontSize: 12.5, color: COLORS.ink, opacity: 0.65, alignSelf: "center" }}>{filteredDiagnostic.length} karyawan</div>
              </div>

              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.8 }}>
                  <thead>
                    <tr style={{ textAlign: "left", color: COLORS.brandDark, borderBottom: `2px solid ${COLORS.gold}` }}>
                      <th style={{ padding: "8px 6px" }}>Nama</th>
                      <th>Divisi</th>
                      <th style={{textAlign:"right"}}>Skor Terakhir</th>
                      <th>Status</th>
                      <th>KPI Terlemah</th>
                      <th>KPI Terbaik</th>
                      <th>Nilai BAHAGIA</th>
                      <th>Kategori Aksi</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredDiagnostic.slice(0, 60).map((e, i) => {
                      const rowId = `${e.brand}-${e.divisi}-${e.nama}`;
                      const isOpen = expandedRow === rowId;
                      return (
                        <React.Fragment key={rowId}>
                          <tr
                            onClick={() => setExpandedRow(isOpen ? null : rowId)}
                            style={{ borderBottom: "1px solid #f0e6d4", cursor: "pointer", background: isOpen ? `${COLORS.gold}12` : "transparent" }}
                          >
                            <td style={{ padding: "7px 6px", fontWeight: 700 }}>{e.nama}</td>
                            <td>{e.divisi} <span style={{opacity:0.5, fontSize:11}}>({e.brand})</span></td>
                            <td style={{ textAlign: "right", fontWeight: 700 }}>{e.skor_terakhir}</td>
                            <td>
                              <span style={{
                                fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 999,
                                color: "#fff",
                                background: e.status === "Menurun" ? COLORS.danger : e.status === "Meningkat" ? COLORS.good : e.status === "Stagnan" ? COLORS.warn : COLORS.brandMid
                              }}>{e.status}{e.perubahan !== null ? ` (${e.perubahan > 0 ? "+" : ""}${e.perubahan})` : ""}</span>
                            </td>
                            <td style={{ color: COLORS.danger, fontWeight: 600 }}>{e.kpi_terlemah} ({e.nilai_terlemah})</td>
                            <td style={{ color: COLORS.good, fontWeight: 600 }}>{e.kpi_terbaik} ({e.nilai_terbaik})</td>
                            <td>
                              <span style={{
                                fontSize: 11, fontWeight: 800, padding: "2px 9px", borderRadius: 999, color: "#fff",
                                background: e.bahagia_warna
                              }}>{e.bahagia_huruf} · {e.bahagia_nilai}</span>
                            </td>
                            <td>
                              <span style={{ fontSize: 11, fontWeight: 700, color: KATEGORI_COLOR[e.kategori_aksi] || COLORS.brandMid }}>{e.kategori_aksi}</span>
                            </td>
                            <td style={{ color: COLORS.brandMid, fontWeight: 700 }}>{isOpen ? "▲" : "▼"}</td>
                          </tr>
                          {isOpen && (
                            <tr>
                              <td colSpan={9} style={{ background: `${COLORS.cream}66`, padding: "10px 16px", fontSize: 13, borderBottom: "1px solid #f0e6d4" }}>
                                <div><b>Fokus bulan ini:</b> {e.rekomendasi}</div>
                                <div style={{ marginTop: 6, fontSize: 12, opacity: 0.8, display: "flex", gap: 16, flexWrap: "wrap" }}>
                                  <span>🔗 Terkait nilai <b style={{color: e.bahagia_warna}}>{e.bahagia_nilai}</b> (komponen {e.kpi_terlemah})</span>
                                  {e.masuk_tahun && <span>📅 Bekerja sejak {e.masuk_tahun}</span>}
                                  {e.total_cuti_2026 != null && <span>🏖️ Cuti terpakai 2026: {e.total_cuti_2026} hari</span>}
                                  {e.wellbeing_flag && <span style={{color: COLORS.bersyukur, fontWeight:700}}>⚠ Ada riwayat cuti terkait kondisi personal</span>}
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
                {filteredDiagnostic.length > 60 && (
                  <div style={{ textAlign: "center", fontSize: 12.5, color: COLORS.ink, opacity: 0.6, padding: "10px 0" }}>
                    Menampilkan 60 dari {filteredDiagnostic.length} — gunakan pencarian untuk mempersempit.
                  </div>
                )}
              </div>
              <div style={{fontSize:11.5, color: COLORS.ink, opacity:0.55, marginTop:10}}>Klik baris untuk melihat rekomendasi program lengkap. Diurutkan dari skor terendah.</div>
            </Card>
          </>
        )}

        {tab === "bahagia" && (
          <Card>
            <SectionTitle eyebrow="Nilai Perusahaan" title="Pemetaan Data ke Nilai BAHAGIA" desc={`Setiap huruf BAHAGIA dikaitkan ke komponen KPI yang paling relevan, plus insight dari data ${MONTHS.length} bulan terakhir (${MONTHS[0]}–${LATEST_MONTH}).`} />
            <div style={{ display: "grid", gap: 12 }}>
              {BAHAGIA_MAP.map((v, i) => (
                <div key={i} style={{
                  display: "flex", gap: 14, alignItems: "flex-start",
                  border: `1px solid ${v.warna}33`, borderLeft: `5px solid ${v.warna}`,
                  borderRadius: 10, padding: "12px 16px", background: `${v.warna}08`
                }}>
                  <div style={{
                    width: 34, height: 34, borderRadius: 8, background: v.warna, color: "#fff",
                    display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, flexShrink: 0
                  }}>{v.huruf}</div>
                  <div>
                    <div style={{ fontWeight: 800, color: v.warna, fontSize: 14.5 }}>{v.nilai} <span style={{fontWeight:500, color: COLORS.ink, opacity:0.6, fontSize:12}}>· terkait komponen {v.komponen}</span></div>
                    <div style={{ fontSize: 13, marginTop: 3, color: COLORS.ink }}>{v.insight}</div>
                  </div>
                </div>
              ))}
            </div>
          </Card>
        )}

        {tab === "aksi" && (
          <div style={{ display: "grid", gap: 16 }}>
            <Card>
              <SectionTitle eyebrow={`Fokus Bulan Depan · ${NEXT_MONTH_NAME}`} title="Rencana Aksi HRD — 1 Bulan ke Depan" desc="Sengaja hanya dibuat untuk 1 bulan ke depan karena data & rencana akan di-update tiap bulan begitu penilaian baru masuk. Detail nama per orang ada di tab Diagnostik Individu." />
            </Card>
            {NEXT_MONTH_PLAN.map((prog, i) => (
              <Card key={i}>
                <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 8 }}>
                  <div style={{ width: 10, height: 10, borderRadius: "50%", background: prog.warna, flexShrink: 0 }} />
                  <div style={{ fontWeight: 800, color: prog.warna, fontSize: 15 }}>{prog.fokus}</div>
                </div>
                <ul style={{ margin: 0, paddingLeft: 20 }}>
                  {prog.aksi.map((a, j) => (
                    <li key={j} style={{ fontSize: 13.5, marginBottom: 6, color: COLORS.ink }}>{a}</li>
                  ))}
                </ul>
              </Card>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);

</script>
</body>
</html>
